# Instalador Windows da GALCAD: solvers preparados em Linux (desktop/build-solvers.py, compilação
# cruzada, versões fixas e SHA-256), testados num Windows real contra os casos de referência e
# empacotados com a app Electron num instalador NSIS. O instalador fica como artefacto da execução
# e, nas etiquetas v*, como release.
name: Instalador Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  solvers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Ferramentas de compilação cruzada
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64 gfortran-mingw-w64 binutils-mingw-w64-x86-64
      - name: micromamba
        run: |
          curl -fsSL -o micromamba https://github.com/mamba-org/micromamba-releases/releases/download/2.3.3-0/micromamba-linux-64
          chmod +x micromamba
          echo "MICROMAMBA=$PWD/micromamba" >> "$GITHUB_ENV"
      - name: Solvers (CalculiX, Gmsh, XFOIL)
        run: python3 desktop/build-solvers.py --out desktop/solvers/win --work /tmp/galcad-solvers
      - uses: actions/upload-artifact@v4
        with:
          name: solvers-win
          path: desktop/solvers/win
          retention-days: 7

  installer:
    needs: solvers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: solvers-win
          path: desktop/solvers/win
      - run: npm ci
      - name: Solvers no Windows (versões)
        shell: bash
        run: |
          desktop/solvers/win/calculix/ccx.exe -v | head -3
          desktop/solvers/win/gmsh/gmsh.exe --version
      - name: Casos de referência com os solvers incluídos (consola, modal/térmica, atrito, XFOIL)
        shell: bash
        env:
          CAD_CCX: ${{ github.workspace }}\desktop\solvers\win\calculix\ccx.exe
          CAD_GMSH: ${{ github.workspace }}\desktop\solvers\win\gmsh\gmsh.exe
          CAD_XFOIL: ${{ github.workspace }}\desktop\solvers\win\xfoil\xfoil.exe
        run: node --test --test-name-pattern="consola — flecha|frequência própria|atrito|XFOIL real" tests/sim.test.ts tests/sim-assembly.test.ts tests/calc.test.ts
      - name: Instalador
        run: npm run dist:win
      - name: Instalar em silêncio e testar a app instalada (agente embutido + consola no CalculiX)
        shell: pwsh
        run: |
          $setup = Get-ChildItem release\GALCAD-Setup-*.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          $app = Join-Path $env:LOCALAPPDATA 'Programs\GALCAD'
          & (Join-Path $app 'resources\solvers\calculix\ccx.exe') -v
          & (Join-Path $app 'resources\solvers\gmsh\gmsh.exe') --version
          npm install --no-save playwright@1.63.0
          $env:DESKTOP_EXE = Join-Path $app 'GALCAD.exe'
          node tests/e2e/desktop.e2e.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: GALCAD-Setup
          path: release/GALCAD-Setup-*.exe
          retention-days: 30
      - name: Release (etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/GALCAD-Setup-*.exe
