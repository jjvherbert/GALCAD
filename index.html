<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CAD protótipo</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <script>
    // Aplica o tema guardado antes do primeiro paint (evita o clarão claro ao abrir em modo escuro).
    try {
      var t = JSON.parse(localStorage.getItem("cad-prototipo:settings") || "{}").theme;
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) { /* sem armazenamento: segue o sistema */ }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/app/main.tsx"></script>
</body>
</html>
